[project]
name = "personaai-api"
version = "0.1.0"
description = "PersonaAI backend: FastAPI + Celery persona/evidence engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "greenlet>=3.1",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "email-validator>=2.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Document parsing + AI providers + embeddings. Installed when those features land.
ingestion = [
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
]
ai = [
    "anthropic>=0.40",
    "openai>=1.57",
    "google-genai>=0.3",
]
embeddings = [
    "fastembed>=0.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
